# MCPize Configuration
# Docs: https://mcpize.com/docs/mcpize-yaml

version: 1

name: "Jakesholl7 GitHub Io"
slug: "jakesholl7-github-io"

runtime: typescript
entry: "dist/index.js"

build:
  install: "npm install"
  command: "npm run build"

start:
  type: http
  command: "node dist/index.js"

bridge:
  mode: http
